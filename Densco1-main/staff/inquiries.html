<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Inquiries — Densco Staff Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body data-page="inquiries" data-roles="owner admin">
    <div class="app">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="app-main">
        <main>
          <div class="page-head">
            <h1>Customer inquiries</h1>
            <p class="muted">
              Escalated questions from the Densco Assistant chatbot.
            </p>
          </div>
          <div class="inq">
            <div class="card" style="padding: 14px">
              <h3>Conversations</h3>
              <div class="inq-list" id="list"></div>
            </div>
            <div class="card">
              <h3 id="title">Select a conversation</h3>
              <div class="thread" id="thread">
                <div class="empty">
                  Choose a conversation from the list to view and reply.
                </div>
              </div>
              <form class="reply hide" id="replyForm">
                <input
                  id="replyIn"
                  placeholder="Type your reply"
                  autocomplete="off"
                /><button class="btn btn-red">Send</button>
              </form>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script src="../js/store.js"></script>
    <script src="../js/staff-portal.js"></script>
    <script>
      const K = "denscoInquiries";
      let active = null;
      function read() {
        return DHP.get(K, []);
      }
      function write(v) {
        DHP.put(K, v);
      }
      function renderList() {
        const L = read();
        document.getElementById("list").innerHTML = L.length
          ? L.map(
              (i) =>
                `<div class="inq-item ${i.id === active ? "on" : ""}" data-id="${i.id}"><div><b>${DHP.esc(i.customer)}</b><span class="badge ${i.status === "answered" ? "completed" : "pending"}">${i.status === "answered" ? "Answered" : "Open"}</span></div><p>${DHP.esc(i.question)}</p></div>`,
            ).join("")
          : '<div class="empty">No escalated conversations yet.</div>';
      }
      function renderThread() {
        const t = document.getElementById("thread"),
          f = document.getElementById("replyForm"),
          i = read().find((x) => x.id === active);
        if (!i) {
          document.getElementById("title").textContent =
            "Select a conversation";
          t.innerHTML =
            '<div class="empty">Choose a conversation from the list to view and reply.</div>';
          f.classList.add("hide");
          return;
        }
        document.getElementById("title").textContent = i.customer + ", " + i.id;
        t.innerHTML = i.messages
          .map(
            (m) =>
              `<div class="bubble ${m.sender === "staff" ? "staff" : "customer"}">${DHP.esc(m.text)}</div>`,
          )
          .join("");
        t.scrollTop = t.scrollHeight;
        f.classList.remove("hide");
      }
      document.getElementById("list").addEventListener("click", (e) => {
        const it = e.target.closest("[data-id]");
        if (!it) return;
        active = it.dataset.id;
        renderList();
        renderThread();
      });
      document.getElementById("replyForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const inp = document.getElementById("replyIn"),
          t = inp.value.trim();
        if (!t) return;
        const L = read();
        L.forEach((i) => {
          if (i.id === active) {
            i.messages.push({
              sender: "staff",
              text: t,
              time: new Date().toISOString(),
            });
            i.status = "answered";
          }
        });
        write(L);
        inp.value = "";
        renderList();
        renderThread();
      });
      setInterval(() => {
        renderList();
        renderThread();
      }, 4000);
      renderList();
      renderThread();
    </script>
  </body>
</html>
