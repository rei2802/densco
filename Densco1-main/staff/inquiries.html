<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Inquiries — Densco Staff Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body data-page="inquiries" data-roles="owner admin inventory">
    <div class="app">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="app-main">
        <main>
          <div class="page-head">
            <h1>Customer inquiries</h1>
            <p class="muted">
              Escalated questions from the Densco Assistant chatbot.
            </p>
          </div>
          <div class="inq">
            <div class="card" style="padding: 14px">
              <h3>Conversations</h3>
              <div class="inq-list" id="list"><p class="muted">Loading conversations…</p></div>
            </div>
            <div class="card">
              <h3 id="title">Select a conversation</h3>
              <p id="chatState" role="status"></p>
              <p class="hide" id="chatError" role="status"></p>
              <div class="thread" id="thread" role="log" aria-label="Conversation messages">
              </div>
              <form class="reply hide" id="replyForm">
                <input
                  id="replyIn"
                  placeholder="Type your reply"
                  aria-label="Reply to customer"
                  autocomplete="off"
                /><button class="btn btn-red" type="submit">Send</button>
              </form>
              <button class="btn btn-sm hide" id="endConversation" type="button">End conversation</button>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script src="../js/store.js"></script>
    <script src="../js/staff-portal.js"></script>
    <script src="../js/staff-inquiries.js"></script>
  </body>
</html>
