<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Settings — Densco Staff Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body data-page="settings" data-roles="owner">
    <div class="app">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="app-main">
        <main>
          <div class="page-head"><h1>Business and system settings</h1></div>
          <div class="grid2">
            <div class="card">
              <h3>Business information</h3>
              <div class="field">
                <label>Address</label><input id="sAddr" />
              </div>
              <div class="field">
                <label>Operating hours</label><input id="sHours" />
              </div>
              <div class="field">
                <label>Contact channels</label><input id="sContact" />
              </div>
              <div class="field">
                <label>Viber number</label><input id="sViber" placeholder="0917 123 4567" />
              </div>
              <div class="field">
                <label>Facebook page link</label><input id="sFb" type="url" placeholder="https://www.facebook.com/yourpage" />
              </div>
              <div class="field">
                <label>Map link (Google Maps)</label><input id="sMap" type="url" placeholder="https://maps.app.goo.gl/..." />
              </div>
            </div>
            <div class="card">
              <h3>Operations</h3>
              <div class="field">
                <label>Delivery fee, Metro Manila (₱)</label
                ><input id="sFee" type="number" min="0" max="100000" step="0.01" />
              </div>
              <div class="field">
                <label>Low-stock threshold (units)</label
                ><input id="sLow" type="number" min="0" max="100000" step="1" />
              </div>
            </div>
          </div>
          <button class="btn btn-red btn-lg mt" id="save">Save settings</button>
          <p id="settingsStatus" role="status"></p>
        </main>
      </div>
    </div>
    <script src="../api/settings.php?script=1"></script>
    <script src="../js/store.js"></script>
    <script src="../js/staff-portal.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      const previous = window.DHP_SETTINGS_SAVED === false ? DHP.get("denscoSettings", null) : null;
      const current = { ...DHP.biz(), ...DHP.settings(), ...previous };
      $("sAddr").value = current.address;
      $("sHours").value = current.hours;
      $("sContact").value = current.contact;
      $("sViber").value = current.viber;
      $("sFb").value = current.facebook;
      $("sMap").value = current.mapUrl;
      $("sFee").value = current.deliveryFee;
      $("sLow").value = current.lowStock;
      const saveButton = $("save");
      const settingsStatus = $("settingsStatus");
      if (!window.DHP_SETTINGS) {
        saveButton.disabled = true;
        settingsStatus.textContent = "Could not load shared settings. Reload this page to try again.";
      } else if (previous) {
        settingsStatus.textContent = "Review the settings previously saved in this browser, then save to share them with all users.";
      }
      saveButton.onclick = async () => {
        const fee = $("sFee");
        const low = $("sLow");
        if (fee.value === "" || low.value === "" || !fee.checkValidity() || !low.checkValidity()) {
          settingsStatus.textContent = "Enter a valid delivery fee and whole-number stock threshold.";
          return;
        }
        const settings = {
          address: $("sAddr").value.trim(),
          hours: $("sHours").value.trim(),
          contact: $("sContact").value.trim(),
          viber: $("sViber").value.trim(),
          facebook: $("sFb").value.trim(),
          mapUrl: $("sMap").value.trim(),
          deliveryFee: Number(fee.value),
          lowStock: Number(low.value),
        };
        saveButton.disabled = true;
        settingsStatus.textContent = "";
        try {
          const response = await fetch("../api/settings.php", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(settings),
          });
          const result = await response.json();
          if (!response.ok) {
            settingsStatus.textContent = result.error || "Could not save settings.";
            return;
          }
          window.DHP_SETTINGS = result.settings;
          window.DHP_SETTINGS_SAVED = true;
          settingsStatus.textContent = "Settings saved for all users.";
        } catch (error) {
          settingsStatus.textContent = "Could not save settings. Try again.";
        } finally {
          saveButton.disabled = false;
        }
      };
    </script>
  </body>
</html>
