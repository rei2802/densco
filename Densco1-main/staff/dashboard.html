<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dashboard — Densco Staff Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body data-page="dashboard" data-roles="">
    <div class="app">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="app-main">
        <main>
          <div class="page-head">
            <div>
              <h1>Dashboard</h1>
              <p class="muted" id="sub"></p>
            </div>
          </div>
          <div class="grid4" id="kpis" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))"></div>
          <div class="grid2 mt2">
            <div class="card">
              <h3>Recent orders</h3>
              <div id="recent"><p class="muted">Loading...</p></div>
            </div>
            <div class="card" style="margin-top:0">
              <h3>Pending orders</h3>
              <div id="pendingList"><p class="muted">Loading...</p></div>
            </div>
          </div>
          <div class="card mt2">
            <h3>Low stock alerts</h3>
            <div id="low"><p class="muted">Loading...</p></div>
          </div>
        </main>
      </div>
    </div>
    <script src="../js/store.js"></script>
    <script src="../js/staff-portal.js"></script>
    <script>
      DHP.applyRoles(document);
      document.getElementById("sub").textContent =
        "Signed in as " +
        DHP.roleName +
        ", " +
        new Date().toLocaleDateString("en-US", {
          weekday: "long",
          month: "long",
          day: "numeric",
        });
      // Every number on this page comes from the database (orders.php and
      // inventory.php summaries). The one exception is "Open inquiries": chat
      // inquiries are only stored in the browser, so that count is local.
      const $ = (id) => document.getElementById(id);
      const kpiLink = (label, value, href, note) =>
        `<a class="kpi" href="${href}" style="display:block"><small>${label}</small><b>${value}</b>${note ? `<span>${note}</span>` : ""}</a>`;

      const orderRow = (o, extra) =>
        `<div class="row"><span><b>${DHP.esc(o.id)}</b><br><span class="muted">${DHP.esc(o.customer)}, ${DHP.esc(o.date)}</span></span>` +
        (extra || `<span class="badge ${o.status}">${DHP.statusLabel(o)}</span>`) +
        `</div>`;

      let ORD = null;   // orders summary
      let INV = null;   // inventory summary

      function renderKpis() {
        const dash = "-";
        const k = [
          kpiLink("Pending orders", ORD ? ORD.pending : dash, "orders.php", "Waiting for confirmation"),
          kpiLink("Active orders", ORD ? ORD.active : dash, "orders.php", "Pending, confirmed or shipped"),
          kpiLink("Products", INV ? INV.total + " items" : dash, "inventory.php"),
          kpiLink("Low stock alerts", INV && INV.low_items ? INV.low_items.length : dash, "inventory.php", "Low or out of stock"),
        ];
        if (DHP.role === "owner") {
          k.push(kpiLink("Revenue (completed)", ORD && ORD.revenue !== undefined ? DHP.peso(ORD.revenue) : dash, "sales-records.php"));
        } else if (DHP.role === "admin") {
          k.push(kpiLink("Open inquiries", DHP.get("denscoInquiries", []).filter((i) => i.status === "open").length, "inquiries.html"));
        } else {
          k.push(kpiLink("Needs restocking", INV && INV.low_items ? INV.low_items.length : dash, "inventory.php"));
        }
        $("kpis").innerHTML = k.join("");
      }

      function renderOrders() {
        if (!ORD) return;
        $("recent").innerHTML = ORD.recent.length
          ? '<div class="list">' + ORD.recent.map((o) => orderRow(o)).join("") + "</div>"
          : '<p class="muted">No orders yet.</p>';

        $("pendingList").innerHTML = ORD.pending_list.length
          ? '<div class="list">' +
            ORD.pending_list.map((o) => orderRow(o, `<span><b>${DHP.peso(o.total)}</b></span>`)).join("") +
            "</div>" +
            (ORD.pending > ORD.pending_list.length
              ? `<p class="muted sm mt"><a href="orders.php">View all ${ORD.pending} pending orders</a></p>`
              : `<p class="muted sm mt"><a href="orders.php">Open the orders page</a></p>`)
          : '<p class="muted">No pending orders. You\'re all caught up.</p>';
      }

      function renderLow() {
        if (!INV || !INV.low_items) return;
        const low = DHP.settings().lowStock;
        $("low").innerHTML = INV.low_items.length
          ? '<div class="list">' +
            INV.low_items
              .map((p) => {
                const out = p.stock <= 0;
                return `<div class="row"><span><b>${DHP.esc(p.name)}</b><br><span class="muted">${DHP.esc(p.cat)}</span></span>` +
                  `<span class="stock ${out ? "out" : "low"}">${out ? "Out of stock" : p.stock + " units left"}</span></div>`;
              })
              .join("") +
            "</div>"
          : `<p class="muted">All products are above the low-stock level (${low} units).</p>`;
      }

      renderKpis();

      fetch("orders.php?summary=1", { credentials: "same-origin" })
        .then((r) => (r.ok ? r.json() : null))
        .then((d) => {
          if (d && d.success) ORD = d;
          renderKpis();
          renderOrders();
          if (!ORD) {
            $("recent").innerHTML = '<p class="muted">Could not load orders.</p>';
            $("pendingList").innerHTML = '<p class="muted">Could not load orders.</p>';
          }
        })
        .catch(() => {
          $("recent").innerHTML = '<p class="muted">Could not load orders.</p>';
          $("pendingList").innerHTML = '<p class="muted">Could not load orders.</p>';
        });

      fetch("inventory.php?summary=1&low=" + encodeURIComponent(DHP.settings().lowStock), { credentials: "same-origin" })
        .then((r) => (r.ok ? r.json() : null))
        .then((d) => {
          if (d && d.success) INV = d;
          renderKpis();
          renderLow();
          if (!INV || !INV.low_items) $("low").innerHTML = '<p class="muted">Could not load stock levels.</p>';
        })
        .catch(() => {
          $("low").innerHTML = '<p class="muted">Could not load stock levels.</p>';
        });
    </script>
  </body>
</html>
