<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Manage Accounts — Densco Staff Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body data-page="staff" data-roles="owner admin">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <main>
        <div class="page-head">
          <h1>Manage accounts</h1>
          <p class="muted">Create staff accounts and manage all currently active accounts across every role.</p>
        </div>

        <div class="card">
          <div class="flex between">
            <div>
              <h3 style="margin-bottom:2px">Create staff account</h3>
              <p class="muted sm">Add a new Administrator or Inventory Staff login.</p>
            </div>
            <button class="btn btn-red" id="openCreate">Create account</button>
          </div>
        </div>

        <div class="card">
          <h3>Active accounts (<span id="count">0</span>)</h3>
          <div class="list" id="accts"><div class="empty">Loading accounts...</div></div>
        </div>

        <div class="modal" id="createModal">
          <div class="modal-box">
            <div class="modal-head">
              <h3>Create account</h3>
              <button class="modal-x" data-close>&times;</button>
            </div>
            <div class="field">
              <label for="cType">Account type</label>
              <select id="cType">
                <option value="">Select account type</option>
                <option value="admin">Administrator</option>
                <option value="inventory">Inventory Staff</option>
              </select>
            </div>
            <div class="field">
              <label for="cName">Full name</label>
              <input id="cName" maxlength="100" autocomplete="off">
            </div>
            <div class="field">
              <label for="cEmail">Email</label>
              <input id="cEmail" type="email" maxlength="100" autocomplete="off">
            </div>
            <div class="field">
              <label for="cPass">Password</label>
              <input id="cPass" type="password" autocomplete="new-password">
              <p class="muted sm" style="margin-top:6px">At least 8 characters.</p>
            </div>
            <p class="err" id="cErr"></p>
            <div class="flex" style="justify-content:flex-end">
              <button class="btn btn-line" data-close>Cancel</button>
              <button class="btn btn-red" id="cSubmit">Create account</button>
            </div>
          </div>
        </div>

        <div class="modal" id="acctModal">
          <div class="modal-box">
            <div class="modal-head">
              <h3>Account details</h3>
              <button class="modal-x" data-close>&times;</button>
            </div>
            <div id="acctInfo"></div>
            <p class="muted sm mt" id="acctNote"></p>
            <p class="err mt" id="acctErr"></p>
            <div class="flex mt" style="justify-content:flex-end">
              <button class="btn btn-line" data-close>Close</button>
              <button class="btn btn-red" id="acctDelete">Delete account</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/store.js"></script>
  <script src="../js/staff-portal.js"></script>
  <script>
    DHP.applyRoles(document);

    const $ = (id) => document.getElementById(id);
    const LABEL = { owner: "Business Owner", admin: "Administrator", inventory: "Inventory Staff" };
    let ACCOUNTS = [];
    let ME = 0;
    let selected = null;

    function renderRow(a) {
      return (
        `<div class="row">` +
          `<span><b>${DHP.esc(a.name)}</b><span class="muted">${DHP.esc(LABEL[a.role] || a.role)}, ${DHP.esc(a.email)}</span></span>` +
          `<span class="flex">` +
            `<span class="badge in">Active</span>` +
            `<button class="btn btn-line btn-sm" data-manage="${a.id}">Manage</button>` +
          `</span>` +
        `</div>`
      );
    }

    function render() {
      $("count").textContent = ACCOUNTS.length;
      $("accts").innerHTML = ACCOUNTS.length
        ? ACCOUNTS.map(renderRow).join("")
        : '<div class="empty">No accounts found.</div>';
    }

    function load() {
      return fetch("accounts.php?json=1", { credentials: "same-origin" })
        .then((r) => {
          if (r.status === 401) {
            location.href = "login.php";
            return null;
          }
          return r.json();
        })
        .then((d) => {
          if (!d) return;
          if (!d.success) throw new Error(d.error);
          ACCOUNTS = d.accounts;
          ME = d.me;
          render();
        })
        .catch(() => {
          $("accts").innerHTML = '<div class="empty">Could not load accounts. Please refresh.</div>';
        });
    }

    function detailRow(label, value) {
      return `<div class="row"><span class="muted">${label}</span><b>${DHP.esc(value)}</b></div>`;
    }

    $("accts").addEventListener("click", (e) => {
      const b = e.target.closest("[data-manage]");
      if (!b) return;

      const a = ACCOUNTS.find((x) => String(x.id) === b.dataset.manage);
      if (!a) return;
      selected = a;

      $("acctInfo").innerHTML =
        '<div class="list">' +
        detailRow("Name", a.name) +
        detailRow("Email", a.email) +
        detailRow("Role", LABEL[a.role] || a.role) +
        detailRow("Status", "Active") +
        detailRow("Created", a.created) +
        "</div>";

      $("acctErr").textContent = "";
      const isSelf = a.id === ME;
      const isOwner = a.role === "owner";
      $("acctDelete").disabled = isSelf || isOwner;
      $("acctNote").textContent = isSelf
        ? "You can't delete the account you are signed in with."
        : isOwner
          ? "The owner account can't be deleted."
          : "";

      $("acctModal").classList.add("open");
    });

    $("acctDelete").onclick = async () => {
      if (!selected) return;
      if (!confirm("Delete the account of " + selected.name + "? This can't be undone.")) return;

      $("acctErr").textContent = "";
      try {
        const r = await fetch("accounts.php", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "delete", id: selected.id })
        });
        if (r.status === 401) {
          location.href = "login.php";
          return;
        }
        const d = await r.json();
        if (!d.success) {
          $("acctErr").textContent = d.error || "Could not delete the account.";
          return;
        }
        $("acctModal").classList.remove("open");
        DHP.toast("Account deleted");
        selected = null;
        load();
      } catch (err) {
        $("acctErr").textContent = "Something went wrong. Please try again.";
      }
    };


    // ---- Create a new staff account
    $("openCreate").onclick = () => {
      $("cType").value = "";
      $("cName").value = "";
      $("cEmail").value = "";
      $("cPass").value = "";
      $("cErr").textContent = "";
      $("createModal").classList.add("open");
    };

    $("cSubmit").onclick = async () => {
      const err = $("cErr");
      err.textContent = "";

      const role = $("cType").value;
      const name = $("cName").value.trim();
      const email = $("cEmail").value.trim();
      const password = $("cPass").value;

      if (!role) { err.textContent = "Choose an account type."; return; }
      if (!name) { err.textContent = "Enter the full name."; return; }
      if (!email) { err.textContent = "Enter the email."; return; }
      if (password.length < 8) { err.textContent = "Password must be at least 8 characters."; return; }

      $("cSubmit").disabled = true;
      try {
        const r = await fetch("accounts.php", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "create", role: role, name: name, email: email, password: password })
        });
        if (r.status === 401) { location.href = "login.php"; return; }
        const d = await r.json();
        if (!d.success) { err.textContent = d.error || "Could not create the account."; return; }

        $("createModal").classList.remove("open");
        DHP.toast("Account created");
        load();
      } catch (e) {
        err.textContent = "Something went wrong. Please try again.";
      } finally {
        $("cSubmit").disabled = false;
      }
    };

    load();
  </script>
</body>
</html>
