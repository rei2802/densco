<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My account — Densco Health Products</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="hdr" id="siteHeader"></header>

  <main class="page wrap">
    <div class="page-head">
      <div>
        <h1>My Account</h1>
        <p class="muted">Signed in as <b id="who"></b></p>
      </div>
      <a class="btn btn-red" href="catalog.php">Continue shopping</a>
    </div>
    <div class="card" id="profileCard">
      <h3>My information</h3>
      <p class="muted sm" style="margin:-6px 0 14px">Your address and mobile number are filled in automatically when you check out.</p>
      <form id="infoForm" novalidate>
        <div class="row2">
          <div class="field">
            <label for="pName">Full name</label>
            <input id="pName" maxlength="100" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="pEmail">Email</label>
            <input id="pEmail" type="email" maxlength="100" autocomplete="email" required>
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label for="pPhone">Mobile number</label>
            <input id="pPhone" type="tel" inputmode="numeric" maxlength="11" placeholder="09XX XXX XXXX" autocomplete="tel">
          </div>
          <div class="field">
            <label for="pAddress">Delivery address</label>
            <input id="pAddress" maxlength="255" placeholder="Street, barangay, city, province" autocomplete="street-address">
          </div>
        </div>
        <p class="err" id="infoMsg" role="status"></p>
        <button class="btn btn-red" type="submit" id="infoSave">Save changes</button>
      </form>

      <h3 style="margin-top:26px">Change password</h3>
      <form id="pwForm" novalidate>
        <div class="field">
          <label for="pwCur">Current password</label>
          <input id="pwCur" type="password" autocomplete="current-password">
        </div>
        <div class="row2">
          <div class="field">
            <label for="pwNew">New password</label>
            <input id="pwNew" type="password" autocomplete="new-password" placeholder="At least 6 characters">
          </div>
          <div class="field">
            <label for="pwNew2">Confirm new password</label>
            <input id="pwNew2" type="password" autocomplete="new-password">
          </div>
        </div>
        <p class="err" id="pwMsg" role="status"></p>
        <button class="btn btn-red" type="submit" id="pwSave">Update password</button>
      </form>
    </div>

    <h2 id="orderHistory" style="margin:28px 0 14px;font-size:20px;scroll-margin-top:90px">Order history</h2>
    <div id="orders"></div>
  </main>

  <div class="modal" id="receiptModal">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="receiptTitle">Payment receipt</h3>
        <button class="modal-x" data-close aria-label="Close">&times;</button>
      </div>
      <div class="proof" id="receiptBody" style="height:auto;min-height:200px;overflow:hidden"></div>
      <div id="receiptRef" class="mt"></div>
      <button class="btn btn-line mt" data-close>Close</button>
    </div>
  </div>

  <footer class="ftr" id="siteFooter"></footer>

  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/popup.js"></script>
  <script>
    // ---------- My information ----------
    (function () {
      const $i = (id) => document.getElementById(id);

      function say(el, text, ok) {
        el.textContent = text || "";
        el.style.color = ok ? "var(--ok)" : "";
      }

      function fill(p) {
        $i("pName").value = p.name || "";
        $i("pEmail").value = p.email || "";
        $i("pPhone").value = p.phone || "";
        $i("pAddress").value = p.address || "";
      }

      $i("pPhone").addEventListener("input", (e) => {
        e.target.value = e.target.value.replace(/\D/g, "").slice(0, 11);
      });

      fetch("profile.php", { credentials: "same-origin" })
        .then((r) => r.json())
        .then((d) => {
          if (d.success) fill(d.profile);
          else say($i("infoMsg"), d.error || "Could not load your information.");
        })
        .catch(() => say($i("infoMsg"), "Could not load your information."));

      function post(body) {
        return fetch("profile.php", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        }).then((r) => r.json());
      }

      $i("infoForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const msg = $i("infoMsg");
        const name = $i("pName").value.trim();
        const email = $i("pEmail").value.trim();
        const phone = $i("pPhone").value.trim();

        if (!name || !email) return say(msg, "Name and email are required.");
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return say(msg, "Enter a valid email address.");
        if (phone && !/^09\d{9}$/.test(phone)) return say(msg, "Enter an 11-digit mobile number starting with 09.");

        say(msg, "");
        $i("infoSave").disabled = true;
        post({ action: "info", name: name, email: email, phone: phone, address: $i("pAddress").value.trim() })
          .then((d) => {
            if (!d.success) return say(msg, d.error || "Could not save your changes.");
            fill(d.profile);
            DHP.login(d.profile.name);               // keep the name shown across the site
            document.getElementById("who").textContent = d.profile.name;
            say(msg, "Your information was saved.", true);
            DHP.toast("Information updated");
          })
          .catch(() => say(msg, "Could not save your changes. Please try again."))
          .finally(() => { $i("infoSave").disabled = false; });
      });

      $i("pwForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const msg = $i("pwMsg");
        const cur = $i("pwCur").value, nw = $i("pwNew").value, nw2 = $i("pwNew2").value;

        if (!cur || !nw) return say(msg, "Fill in your current and new password.");
        if (nw.length < 6) return say(msg, "New password must be at least 6 characters.");
        if (nw !== nw2) return say(msg, "The two new passwords don't match.");

        say(msg, "");
        $i("pwSave").disabled = true;
        post({ action: "password", current: cur, new: nw, confirm: nw2 })
          .then((d) => {
            if (!d.success) return say(msg, d.error || "Could not update your password.");
            $i("pwForm").reset();
            say(msg, "Your password was updated.", true);
            DHP.toast("Password updated");
          })
          .catch(() => say(msg, "Could not update your password. Please try again."))
          .finally(() => { $i("pwSave").disabled = false; });
      });
    })();

    const me = DHP.user();
    document.getElementById("who").textContent = me;
    let ORDERS = [];

    function trackSteps(o) {
      return [
        "Pending",
        "Confirmed",
        o.fulfillment === "Store Pickup" ? "Ready for pickup" : "Out for delivery",
        "Completed"
      ];
    }

    function renderTrack(steps, cur, status) {
      return steps
        .map((s, i) => {
          const state = i < cur || status === "completed" ? "done" : i === cur ? "cur" : "";
          return `<div class="st ${state}">${s}</div>`;
        })
        .join("");
    }

    function renderOrder(o) {
      if (o.status === "cancelled") {
        return `
          <div class="card order">
            <h3>${DHP.esc(o.id)}</h3>
            <span class="badge cancelled">Cancelled</span>
            <div class="mt">
              ${o.proof
                ? `<button class="btn btn-line view-receipt" data-receipt="${o.oid}">View receipt</button>`
                : `<button class="btn btn-line" disabled title="No payment proof uploaded for this order">View receipt</button>`}
            </div>
          </div>
        `;
      }
      const steps = trackSteps(o);
      const cur = ["pending", "confirmed", "shipped", "completed"].indexOf(o.status);

      return (
        `<div class="card order">` +
          `<div class="order-top">` +
            `<div>` +
              `<h3>${DHP.esc(o.id)}</h3>` +
              `<div class="muted sm">${DHP.esc(o.date)}, ${DHP.esc(o.fulfillment)}, paid by ${DHP.esc(o.payment)}</div>` +
            `</div>` +
            `<div class="right">` +
              `<b style="font-size:17px;color:var(--ink)">${DHP.peso(o.total)}</b><br>` +
              `<span class="badge ${o.status}">${DHP.statusLabel(o)}</span>` +
            `</div>` +
          `</div>` +
          `<p class="mt">${DHP.esc(o.summary)}</p>` +
          `<div class="track">${renderTrack(steps, cur, o.status)}</div>` +

          `<div class="mt" style="display:flex;gap:10px;flex-wrap:wrap">` +
            (o.proof
              ? `<button class="btn btn-line view-receipt" data-receipt="${o.oid}">View receipt</button>`
              : `<button class="btn btn-line" disabled title="No payment proof uploaded for this order">View receipt</button>`) +
            (o.status === "pending"
              ? `<button class="btn btn-red cancel-order" data-id="${o.oid}">
                  Cancel Order
                </button>`
              : "") +
          `</div>` +

          `</div>`
      );
    }

    const receiptModal = document.getElementById("receiptModal");

    function openReceipt(o) {
      document.getElementById("receiptTitle").textContent = "Payment receipt, " + o.id;

      // proof is a Cloudinary URL. Most uploads are images, but checkout also
      // accepts PDFs, which can't render in an <img>.
      const body = document.getElementById("receiptBody");
      body.innerHTML = "";
      const link = document.createElement("a");
      link.href = o.proof;
      link.target = "_blank";
      link.rel = "noopener";
      if (/\.pdf(\?|$)/i.test(o.proof)) {
        link.textContent = "Open the uploaded PDF";
      } else {
        const img = document.createElement("img");
        img.src = o.proof;
        img.alt = "Payment receipt";
        img.style.cssText = "display:block;max-width:100%;max-height:60vh;object-fit:contain";
        img.onerror = () => { link.textContent = "Could not load the image. Open it in a new tab."; };
        link.appendChild(img);
      }
      body.appendChild(link);

      const ref = document.getElementById("receiptRef");
      ref.innerHTML = o.reference_number
        ? `<span class="muted sm">Reference number</span><br><b>${DHP.esc(o.reference_number)}</b>`
        : "";

      receiptModal.classList.add("open");
    }

    function closeReceipt() {
      receiptModal.classList.remove("open");
    }

    receiptModal.addEventListener("click", (e) => {
      if (e.target === receiptModal || e.target.closest("[data-close]")) closeReceipt();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeReceipt();
    });

    const box = document.getElementById("orders");
    box.addEventListener("click", (e) => {
      const b = e.target.closest("[data-receipt]");
      if (!b) return;
      const o = ORDERS.find((x) => String(x.oid) === b.dataset.receipt);
      if (o && o.proof) openReceipt(o);
    });
    box.innerHTML = '<div class="card empty">Loading your orders...</div>';

    fetch("my_orders.php", { credentials: "same-origin" })
      .then((r) => {
        if (r.status === 401) {
          // Server session ended: sign out locally and ask the customer to log in again
          DHP.logout();
          location.replace("login.php?next=account.html");
          return null;
        }
        return r.json();
      })
      .then((d) => {
        if (!d) return;
        if (!d.success) throw new Error(d.error);
        ORDERS = d.orders;
        box.innerHTML = d.orders.length
          ? d.orders.map(renderOrder).join("")
          : '<div class="card empty">You haven\'t placed an order yet. <a href="catalog.php">Browse the shop</a></div>';

        // Coming from "View my orders" (account.html#orders): jump straight to the order list
        if (location.hash === "#orders") {
          document.getElementById("orderHistory").scrollIntoView({ block: "start" });
        }

          document.querySelectorAll(".cancel-order").forEach(btn => {
            btn.addEventListener("click", () => {
              const orderId = btn.dataset.id;
              console.log("Order ID being sent:", orderId);

              const o = ORDERS.find((x) => String(x.oid) === String(orderId)) || {};
              // summary looks like "Product A ×1, Product B ×2"
              const items = [...(o.summary || "").matchAll(/(?:^|,\s)(.+?)\s×(\d+)(?=,\s|$)/g)]
                .map((m) => ({ name: m[1], qty: m[2] }));
              const shownItems = items.length ? items : [{ name: o.summary || "" }];

              DHP.confirmCancelPopup({
                orderId: o.id || orderId,
                items: shownItems,
                onConfirm: () => {
                  fetch("cancel_order.php", {
                    method: "POST",
                    headers: {
                      "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: `order_id=${encodeURIComponent(orderId)}`
                  })
                  .then(r => r.json())
                  .then(data => {
                    if (data.success) {
                      DHP.orderPopup({
                        type: "cancelled",
                        orderId: o.id || orderId,
                        items: shownItems,
                        onClose: () => location.reload()
                      });
                    } else {
                      DHP.noticePopup({
                        title: "Couldn't cancel the order",
                        sub: data.error || "Please try again.",
                        orderId: o.id || orderId,
                        items: shownItems,
                        onClose: () => location.reload()
                      });
                    }
                  })
                  .catch(() => {
                    DHP.noticePopup({
                      title: "Couldn't cancel the order",
                      sub: "Something went wrong. Please check your connection and try again.",
                      orderId: o.id || orderId,
                      items: shownItems
                    });
                  });
                }
              });
            });
          });
      })
      .catch(() => {
        box.innerHTML = '<div class="card empty">Could not load your orders. Please refresh the page.</div>';
      });
  </script>
</body>
</html>
